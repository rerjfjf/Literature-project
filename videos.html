<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Видеотека — Электронный учебник</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .videos-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 12px clamp(16px, 3vw, 34px);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--page) 88%, transparent);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .videos-shell { width: min(1100px, 100%); margin: 0 auto; padding: clamp(18px, 3vw, 34px); }
    .videos-group + .videos-group { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
    .videos-group h2 { font-family: var(--serif); margin: 0 0 14px; }
    .videos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .video-tile { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--page-soft); }
    .video-tile.is-target { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .video-tile h3 { margin: 0; font-family: var(--serif); font-size: 1.1rem; line-height: 1.3; }
    .video-tile small { color: var(--muted); }
    .video-frame { width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--page); }
    .video-frame iframe, .video-frame video { width: 100%; height: 100%; border: 0; display: block; }
    .video-placeholder {
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 9;
      border: 1px dashed color-mix(in srgb, var(--accent) 50%, var(--line));
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 12px;
    }
    .videos-empty { color: var(--muted); }
  </style>
</head>
<body>
  <header class="videos-header">
    <a href="index.html" class="book-mark" style="text-decoration:none;color:inherit;">
      <span class="book-mark__label">Учебник</span>
      <strong id="bookTitle">Видеотека</strong>
    </a>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="index.html" class="text-button">← К чтению</a>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Переключить тему" title="Тема">
        <span aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <main class="videos-shell">
    <h1 style="font-family:var(--serif); margin: 0 0 6px;">Видеотека учебника</h1>
    <p style="color:var(--muted); margin: 0 0 24px;">
      Здесь собраны все видеоматериалы учебника. Если видео недоступно — ссылка скоро будет обновлена администратором.
    </p>
    <div id="videosRoot"></div>
  </main>

  <script src="content_parts/author_intro.js"></script>
  <script src="content_parts/author_tvardovsky.js"></script>
  <script src="content_parts/author_okudzhava.js"></script>
  <script src="content_parts/author_zabolotsky.js"></script>
  <script src="content_parts/author_vysotsky.js"></script>
  <script src="content_parts/author_evtyushenko.js"></script>
  <script src="content_parts/author_rybakov.js"></script>
  <script src="content_parts/author_akhmatova.js"></script>
  <script src="content_parts/author_vasilyev.js"></script>
  <script src="content_parts/author_bykov.js"></script>
  <script src="content_parts/author_kondratyev.js"></script>
  <script src="content_parts/author_overview.js"></script>
  <script src="content_parts/author_conclusion.js"></script>
  <script src="content_parts/author_appendices.js"></script>
  <script src="content_loader.js"></script>
  <script>
    if (localStorage.getItem("reader-theme") === "dark") {
      document.documentElement.classList.add("theme-dark");
    }
    document.getElementById("themeToggle").addEventListener("click", () => {
      document.documentElement.classList.toggle("theme-dark");
      localStorage.setItem(
        "reader-theme",
        document.documentElement.classList.contains("theme-dark") ? "dark" : "light"
      );
    });

    // Должно совпадать с VIDEO_EXTRA_PREFIX в админке
    const VIDEO_EXTRA_PREFIX = "videoextra";

    function parseVideoUrl(url) {
      let u;
      try {
        u = new URL(url);
      } catch {
        return null;
      }
      const host = u.hostname.replace(/^www\./, "");

      let ytId = null;
      if (host === "youtu.be") ytId = u.pathname.slice(1);
      else if (host.endsWith("youtube.com")) {
        if (u.pathname === "/watch") ytId = u.searchParams.get("v");
        else if (u.pathname.startsWith("/embed/")) ytId = u.pathname.split("/embed/")[1];
        else if (u.pathname.startsWith("/shorts/")) ytId = u.pathname.split("/shorts/")[1];
        else if (u.pathname.startsWith("/live/")) ytId = u.pathname.split("/live/")[1];
      }
      if (ytId) {
        ytId = ytId.split(/[/?&]/)[0];
        const start = u.searchParams.get("t") || u.searchParams.get("start");
        const startSec = start ? parseInt(start, 10) : 0;
        return {
          type: "iframe",
          src: `https://www.youtube-nocookie.com/embed/${ytId}${startSec ? `?start=${startSec}` : ""}`,
        };
      }

      if (host === "rutube.ru") {
        const m = u.pathname.match(/\/(?:video|play\/embed)\/([0-9a-f]{32})/i);
        if (m) return { type: "iframe", src: `https://rutube.ru/play/embed/${m[1]}` };
      }

      if (/\.(mp4|webm|ogg)$/i.test(u.pathname)) return { type: "video", src: url };

      return null;
    }

    function collectAuthors() {
      const book = window.TEXTBOOK;
      const authors = book.authors || [];
      const map = new Map();
      book.chapters.forEach((chapter) => {
        const id = chapter.authorId || book.authorId;
        if (map.has(id)) return;
        const a = authors.find((x) => x.id === id) || { name: id, fullName: id };
        map.set(id, { id, name: a.fullName || a.name });
      });
      return [...map.values()];
    }

    // Видеоблоки из текста учебника
    function collectVideoBlocks() {
      const book = window.TEXTBOOK;
      const list = [];
      book.chapters.forEach((chapter) => {
        chapter.sections.forEach((section) => {
          const authorId = chapter.authorId || book.authorId;
          (section.blocks || []).forEach((block, blockIndex) => {
            if (block.type !== "video") return;
            const videoId = `${authorId}:${section.id}:${blockIndex}`;
            list.push({
              videoId,
              anchorId: videoId.replace(/:/g, "--"),
              authorId,
              sectionTitle: section.title,
              blockTitle: block.title || "Видеоматериал",
            });
          });
        });
      });
      return list;
    }

    // Дополнительные видео автора, добавленные в админке кнопкой «+»
    function collectExtraVideos(stored, authorId) {
      const p = `${VIDEO_EXTRA_PREFIX}:${authorId}:`;
      return Object.keys(stored)
        .filter((key) => key.startsWith(p))
        .map((key) => ({
          videoId: key,
          anchorId: key.replace(/:/g, "--"),
          authorId,
          n: parseInt(key.slice(p.length), 10),
          sectionTitle: "",
          blockTitle: "",
        }))
        .filter((x) => Number.isFinite(x.n) && stored[x.videoId] && stored[x.videoId].url)
        .sort((a, b) => a.n - b.n)
        .map((x) => ({ ...x, blockTitle: (stored[x.videoId].title || "") || `Видео ${x.n}` }));
    }

    function buildTile(item, entry) {
      const url = (entry && entry.url) || "";

      const tile = document.createElement("article");
      tile.className = "video-tile";
      tile.id = item.anchorId;

      const title = document.createElement("h3");
      title.textContent = (entry && entry.title) || item.blockTitle;
      tile.append(title);
      if (item.sectionTitle) {
        const small = document.createElement("small");
        small.textContent = item.sectionTitle;
        tile.append(small);
      }

      const media = url ? parseVideoUrl(url) : null;
      if (media && media.type === "iframe") {
        const frame = document.createElement("div");
        frame.className = "video-frame";
        const iframe = document.createElement("iframe");
        iframe.src = media.src;
        iframe.title = title.textContent;
        iframe.loading = "lazy";
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        frame.append(iframe);
        tile.append(frame);
      } else if (media && media.type === "video") {
        const frame = document.createElement("div");
        frame.className = "video-frame";
        const video = document.createElement("video");
        video.src = media.src;
        video.controls = true;
        video.preload = "metadata";
        frame.append(video);
        tile.append(frame);
      } else if (url) {
        const link = document.createElement("a");
        link.className = "text-button";
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Открыть видео по ссылке";
        tile.append(link);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "video-placeholder";
        placeholder.textContent = "Ссылка скоро появится";
        tile.append(placeholder);
      }
      return tile;
    }

    async function init() {
      const root = document.getElementById("videosRoot");
      const blocks = collectVideoBlocks();

      let stored = {};
      try {
        const response = await fetch("/api/videos");
        const data = await response.json();
        stored = data.videos || {};
      } catch {
        // сервер недоступен — покажем карточки без ссылок
      }

      root.innerHTML = "";
      let total = 0;

      collectAuthors().forEach((author) => {
        const items = [
          ...blocks.filter((b) => b.authorId === author.id),
          ...collectExtraVideos(stored, author.id),
        ];
        if (!items.length) return;
        total += items.length;

        const section = document.createElement("section");
        section.className = "videos-group";
        const heading = document.createElement("h2");
        heading.textContent = author.name;
        section.append(heading);

        const grid = document.createElement("div");
        grid.className = "videos-grid";
        items.forEach((item) => grid.append(buildTile(item, stored[item.videoId])));
        section.append(grid);
        root.append(section);
      });

      if (!total) {
        root.innerHTML = `<p class="videos-empty">В учебнике пока нет видеоматериалов.</p>`;
        return;
      }

      if (location.hash) {
        const target = document.getElementById(location.hash.slice(1));
        if (target) {
          target.classList.add("is-target");
          target.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
    }

    init();
  </script>
</body>
</html>
