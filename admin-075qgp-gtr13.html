<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Управление видео</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-shell { width: min(900px, 100%); margin: 0 auto; padding: clamp(18px, 3vw, 34px); }
    .login-card {
      display: grid;
      gap: 12px;
      width: min(360px, 100%);
      margin: 90px auto;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--page);
    }
    .login-card input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      background: var(--page);
      color: var(--text);
      outline: none;
    }
    .login-card p.error { color: var(--accent-strong); margin: 0; font-size: 0.88rem; }
    .admin-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .admin-group + .admin-group { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .admin-group h2 { font-family: var(--serif); margin: 0 0 12px; font-size: 1.2rem; }
    .admin-item { padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--page-soft); margin-bottom: 10px; }
    .admin-row { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 10px; align-items: center; }
    .admin-row input, .admin-title-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 10px;
      background: var(--page);
      color: var(--text);
      outline: none;
    }
    .admin-title-input { margin-bottom: 8px; }
    .admin-meta { font-size: 0.85rem; color: var(--muted); line-height: 1.35; margin-bottom: 8px; }
    .admin-meta strong { color: var(--text); }
    .admin-status { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
    .admin-subhead { font-size: 0.9rem; color: var(--muted); margin: 16px 0 8px; }
    .admin-add { margin-top: 2px; }

    .films-admin { margin-top: 36px; padding-top: 24px; border-top: 2px solid var(--line); }
    .films-admin > h1 { font-family: var(--serif); margin: 0 0 6px; font-size: 1.5rem; }
    .films-admin > p { color: var(--muted); margin: 0 0 18px; font-size: 0.9rem; line-height: 1.4; }
    .films-author { margin-bottom: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--page); }
    .films-author > summary {
      cursor: pointer;
      padding: 12px 14px;
      font-family: var(--serif);
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .films-author > summary small { font-family: inherit; color: var(--muted); font-size: 0.85rem; align-self: center; }
    .films-author__body { padding: 4px 14px 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <section class="login-card" id="loginCard">
      <h1 style="font-family:var(--serif); margin:0; font-size:1.4rem;">Панель видео</h1>
      <label>
        Пароль
        <input type="password" id="passwordInput" autocomplete="off" />
      </label>
      <button class="text-button" id="loginButton" type="button">Войти</button>
      <p class="error" id="loginError" hidden></p>
    </section>

    <div id="panel" hidden>
      <div class="admin-topbar">
        <h1 style="font-family:var(--serif); margin:0; font-size:1.5rem;">Ссылки на видео</h1>
        <button class="text-button text-button--ghost" id="logoutButton" type="button">Выйти</button>
      </div>
      <div id="groupsRoot"></div>

      <section class="films-admin">
        <h1>Фильмы</h1>
        <p>
          У каждого автора можно добавить сколько угодно фильмов кнопкой «+».
          Подойдёт ссылка на YouTube, Rutube или прямая ссылка на .mp4. Пустая ссылка убирает фильм со страницы «Фильмы».
        </p>
        <div id="filmsRoot"></div>
      </section>
    </div>
  </div>

  <script src="content_parts/author_intro.js"></script>
  <script src="content_parts/author_tvardovsky.js"></script>
  <script src="content_parts/author_okudzhava.js"></script>
  <script src="content_parts/author_zabolotsky.js"></script>
  <script src="content_parts/author_vysotsky.js"></script>
  <script src="content_parts/author_evtyushenko.js"></script>
  <script src="content_parts/author_rybakov.js"></script>
  <script src="content_parts/author_akhmatova.js"></script>
  <script src="content_parts/author_vasilyev.js"></script>
  <script src="content_parts/author_bykov.js"></script>
  <script src="content_parts/author_kondratyev.js"></script>
  <script src="content_parts/author_overview.js"></script>
  <script src="content_parts/author_conclusion.js"></script>
  <script src="content_parts/author_appendices.js"></script>
  <script src="content_loader.js"></script>
  <script>
    const TOKEN_KEY = "video-admin-token";

    // Префиксы ключей в общем хранилище /api/videos.
    // Те же значения должны стоять в videos.html и films.html.
    const VIDEO_EXTRA_PREFIX = "videoextra";
    const FILM_PREFIX = "film";

    const loginCard = document.getElementById("loginCard");
    const panel = document.getElementById("panel");
    const passwordInput = document.getElementById("passwordInput");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");
    const logoutButton = document.getElementById("logoutButton");
    const groupsRoot = document.getElementById("groupsRoot");
    const filmsRoot = document.getElementById("filmsRoot");

    function collectAuthors() {
      const book = window.TEXTBOOK;
      const authors = book.authors || [];
      const map = new Map();
      book.chapters.forEach((chapter) => {
        const id = chapter.authorId || book.authorId;
        if (map.has(id)) return;
        const a = authors.find((x) => x.id === id) || { name: id, fullName: id };
        map.set(id, { id, name: a.fullName || a.name });
      });
      return [...map.values()];
    }

    function collectVideoBlocks() {
      const book = window.TEXTBOOK;
      const authors = book.authors || [];
      const list = [];
      book.chapters.forEach((chapter) => {
        chapter.sections.forEach((section) => {
          const authorId = chapter.authorId || book.authorId;
          const author = authors.find((a) => a.id === authorId) || { name: authorId, fullName: authorId };
          (section.blocks || []).forEach((block, blockIndex) => {
            if (block.type !== "video") return;
            const videoId = `${authorId}:${section.id}:${blockIndex}`;
            list.push({
              videoId,
              authorId,
              authorName: author.fullName || author.name,
              sectionTitle: section.title,
              blockTitle: block.title || "Видеоматериал",
            });
          });
        });
      });
      return list;
    }

    // Уже сохранённые дополнительные записи автора: ключи вида prefix:authorId:N
    function extraEntries(stored, prefix, authorId) {
      const p = `${prefix}:${authorId}:`;
      return Object.keys(stored)
        .filter((key) => key.startsWith(p))
        .map((key) => ({ key, n: parseInt(key.slice(p.length), 10), entry: stored[key] }))
        .filter((x) => Number.isFinite(x.n))
        .sort((a, b) => a.n - b.n);
    }

    async function login() {
      loginError.hidden = true;
      const password = passwordInput.value;
      if (!password) return;
      loginButton.disabled = true;
      loginButton.textContent = "Проверка...";
      try {
        const response = await fetch("/api/videos/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Неверный пароль");
        sessionStorage.setItem(TOKEN_KEY, data.token);
        await showPanel();
      } catch (error) {
        loginError.textContent = error.message;
        loginError.hidden = false;
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Войти";
      }
    }

    function logout() {
      sessionStorage.removeItem(TOKEN_KEY);
      panel.hidden = true;
      loginCard.hidden = false;
      passwordInput.value = "";
    }

    async function showPanel() {
      loginCard.hidden = true;
      panel.hidden = false;
      const stored = await fetchStored();
      renderRows(stored);
      renderFilms(stored);
    }

    async function fetchStored() {
      try {
        const response = await fetch("/api/videos");
        const data = await response.json();
        return data.videos || {};
      } catch {
        return {}; // покажем пустые поля, если сервер недоступен
      }
    }

    // Строка «поле ссылки + Сохранить» для любого ключа в /api/videos.
    // withTitle добавляет необязательное поле «Название».
    function buildEditor(videoId, entry, titleText, subText, withTitle) {
      const box = document.createElement("div");
      box.className = "admin-item";

      const meta = document.createElement("div");
      meta.className = "admin-meta";
      const strong = document.createElement("strong");
      strong.textContent = titleText;
      meta.append(strong);
      if (subText) {
        meta.append(document.createElement("br"));
        meta.append(document.createTextNode(subText));
      }
      box.append(meta);

      let titleInput = null;
      if (withTitle) {
        titleInput = document.createElement("input");
        titleInput.type = "text";
        titleInput.className = "admin-title-input";
        titleInput.placeholder = "Название (необязательно)";
        titleInput.value = entry.title || "";
        box.append(titleInput);
      }

      const row = document.createElement("div");
      row.className = "admin-row";
      const input = document.createElement("input");
      input.type = "url";
      input.placeholder = "https://www.youtube.com/watch?v=...";
      input.value = entry.url || "";

      const saveButton = document.createElement("button");
      saveButton.className = "text-button";
      saveButton.type = "button";
      saveButton.textContent = "Сохранить";

      const status = document.createElement("div");
      status.className = "admin-status";
      status.textContent = entry.updatedAt
        ? `Обновлено: ${new Date(entry.updatedAt).toLocaleString("ru-RU")}`
        : "Ссылка не задана";

      saveButton.addEventListener("click", async () => {
        saveButton.disabled = true;
        saveButton.textContent = "Сохранение...";
        try {
          const token = sessionStorage.getItem(TOKEN_KEY);
          const body = { url: input.value.trim() };
          if (titleInput) body.title = titleInput.value.trim();
          const response = await fetch(`/api/videos/${encodeURIComponent(videoId)}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(body),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Ошибка сохранения");
          status.textContent = "Сохранено только что";
          saveButton.textContent = "Сохранено";
        } catch (error) {
          if (String(error.message).toLowerCase().includes("вход")) {
            logout();
            return;
          }
          status.textContent = error.message;
          saveButton.textContent = "Ошибка, повторить";
        } finally {
          saveButton.disabled = false;
          setTimeout(() => {
            saveButton.textContent = "Сохранить";
          }, 1800);
        }
      });

      row.append(input, saveButton);
      box.append(row, status);
      return box;
    }

    // Список дополнительных окон автора и кнопка «+», добавляющая ещё одно.
    function buildExtraBlock(prefix, authorId, stored, label) {
      const wrap = document.createElement("div");
      const list = document.createElement("div");
      const items = extraEntries(stored, prefix, authorId);
      let next = items.length ? items[items.length - 1].n + 1 : 1;

      items.forEach(({ key, n, entry }) => {
        list.append(buildEditor(key, entry, `${label} ${n}`, "", true));
      });

      function addEmpty() {
        const n = next++;
        list.append(buildEditor(`${prefix}:${authorId}:${n}`, {}, `${label} ${n}`, "", true));
      }
      if (!items.length) addEmpty();

      const add = document.createElement("button");
      add.className = "text-button text-button--ghost admin-add";
      add.type = "button";
      add.textContent = `+ Добавить ещё (${label.toLowerCase()})`;
      add.addEventListener("click", addEmpty);

      wrap.append(list, add);
      return wrap;
    }

    function renderRows(stored) {
      const blocks = collectVideoBlocks();
      groupsRoot.innerHTML = "";

      collectAuthors().forEach((author) => {
        const wrap = document.createElement("section");
        wrap.className = "admin-group";
        const heading = document.createElement("h2");
        heading.textContent = author.name;
        wrap.append(heading);

        // Видеоблоки, которые уже есть в тексте учебника
        blocks
          .filter((item) => item.authorId === author.id)
          .forEach((item) => {
            const entry = stored[item.videoId] || {};
            wrap.append(buildEditor(item.videoId, entry, entry.title || item.blockTitle, item.sectionTitle, false));
          });

        // Дополнительные видео, добавленные кнопкой «+»
        const sub = document.createElement("div");
        sub.className = "admin-subhead";
        sub.textContent = "Дополнительные видео";
        wrap.append(sub, buildExtraBlock(VIDEO_EXTRA_PREFIX, author.id, stored, "Видео"));

        groupsRoot.append(wrap);
      });
    }

    function renderFilms(stored) {
      filmsRoot.innerHTML = "";

      collectAuthors().forEach((author) => {
        const details = document.createElement("details");
        details.className = "films-author";

        const filled = extraEntries(stored, FILM_PREFIX, author.id).filter((x) => x.entry && x.entry.url).length;
        const summary = document.createElement("summary");
        const name = document.createElement("span");
        name.textContent = author.name;
        const count = document.createElement("small");
        count.textContent = `Фильмов: ${filled}`;
        summary.append(name, count);
        details.append(summary);

        const body = document.createElement("div");
        body.className = "films-author__body";
        body.append(buildExtraBlock(FILM_PREFIX, author.id, stored, "Фильм"));
        details.append(body);

        // Раскрываем авторов, у которых уже есть фильмы
        if (filled) details.open = true;

        filmsRoot.append(details);
      });
    }

    loginButton.addEventListener("click", login);
    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });
    logoutButton.addEventListener("click", logout);

    if (sessionStorage.getItem(TOKEN_KEY)) {
      showPanel();
    }
  </script>
</body>
</html>
