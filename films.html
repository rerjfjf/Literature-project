<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Фильмы — Электронный учебник</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .films-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 12px clamp(16px, 3vw, 34px);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--page) 88%, transparent);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .films-shell { width: min(1100px, 100%); margin: 0 auto; padding: clamp(18px, 3vw, 34px); }
    .films-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 24px; }
    .films-toolbar select {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 12px;
      background: var(--page);
      color: var(--text);
      font: inherit;
      max-width: 100%;
    }
    .films-group + .films-group { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
    .films-group h2 { font-family: var(--serif); margin: 0 0 14px; }
    .films-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .film-tile { display: grid; gap: 10px; align-content: start; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--page-soft); }
    .film-tile.is-target { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .film-tile h3 { margin: 0; font-family: var(--serif); font-size: 1.1rem; line-height: 1.3; }
    .film-frame { width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #000; }
    .film-frame iframe, .film-frame video { width: 100%; height: 100%; border: 0; display: block; }
    .films-empty { color: var(--muted); }
  </style>
</head>
<body>
  <header class="films-header">
    <a href="index.html" class="book-mark" style="text-decoration:none;color:inherit;">
      <span class="book-mark__label">Учебник</span>
      <strong>Фильмы</strong>
    </a>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="index.html" class="text-button">← К чтению</a>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Переключить тему" title="Тема">
        <span aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <main class="films-shell">
    <h1 style="font-family:var(--serif); margin: 0 0 6px;">Фильмы по произведениям</h1>
    <p style="color:var(--muted); margin: 0 0 20px;">
      Экранизации и фильмы, связанные с произведениями учебника. Они собраны по авторам.
    </p>

    <div class="films-toolbar" id="filmsToolbar" hidden>
      <label for="authorFilter" style="color:var(--muted);">Автор</label>
      <select id="authorFilter"></select>
    </div>

    <div id="filmsRoot"></div>
  </main>

  <script src="content_parts/author_intro.js"></script>
  <script src="content_parts/author_tvardovsky.js"></script>
  <script src="content_parts/author_okudzhava.js"></script>
  <script src="content_parts/author_zabolotsky.js"></script>
  <script src="content_parts/author_vysotsky.js"></script>
  <script src="content_parts/author_evtyushenko.js"></script>
  <script src="content_parts/author_rybakov.js"></script>
  <script src="content_parts/author_akhmatova.js"></script>
  <script src="content_parts/author_vasilyev.js"></script>
  <script src="content_parts/author_bykov.js"></script>
  <script src="content_parts/author_kondratyev.js"></script>
  <script src="content_parts/author_overview.js"></script>
  <script src="content_parts/author_conclusion.js"></script>
  <script src="content_parts/author_appendices.js"></script>
  <script src="content_loader.js"></script>
  <script>
    if (localStorage.getItem("reader-theme") === "dark") {
      document.documentElement.classList.add("theme-dark");
    }
    document.getElementById("themeToggle").addEventListener("click", () => {
      document.documentElement.classList.toggle("theme-dark");
      localStorage.setItem(
        "reader-theme",
        document.documentElement.classList.contains("theme-dark") ? "dark" : "light"
      );
    });

    // Должно совпадать с FILM_PREFIX в админке
    const FILM_PREFIX = "film";

    // Превращает ссылку в адрес для встраивания. Возвращает { type, src } или null.
    function parseVideoUrl(url) {
      let u;
      try {
        u = new URL(url);
      } catch {
        return null;
      }
      const host = u.hostname.replace(/^www\./, "");

      let ytId = null;
      if (host === "youtu.be") ytId = u.pathname.slice(1);
      else if (host.endsWith("youtube.com")) {
        if (u.pathname === "/watch") ytId = u.searchParams.get("v");
        else if (u.pathname.startsWith("/embed/")) ytId = u.pathname.split("/embed/")[1];
        else if (u.pathname.startsWith("/shorts/")) ytId = u.pathname.split("/shorts/")[1];
        else if (u.pathname.startsWith("/live/")) ytId = u.pathname.split("/live/")[1];
      }
      if (ytId) {
        ytId = ytId.split(/[/?&]/)[0];
        const start = u.searchParams.get("t") || u.searchParams.get("start");
        const startSec = start ? parseInt(start, 10) : 0;
        return {
          type: "iframe",
          src: `https://www.youtube-nocookie.com/embed/${ytId}${startSec ? `?start=${startSec}` : ""}`,
        };
      }

      if (host === "rutube.ru") {
        const m = u.pathname.match(/\/(?:video|play\/embed)\/([0-9a-f]{32})/i);
        if (m) return { type: "iframe", src: `https://rutube.ru/play/embed/${m[1]}` };
      }

      if (/\.(mp4|webm|ogg)$/i.test(u.pathname)) return { type: "video", src: url };

      return null;
    }

    function collectAuthors() {
      const book = window.TEXTBOOK;
      const authors = book.authors || [];
      const map = new Map();
      book.chapters.forEach((chapter) => {
        const id = chapter.authorId || book.authorId;
        if (map.has(id)) return;
        const a = authors.find((x) => x.id === id) || { name: id, fullName: id };
        map.set(id, { id, name: a.fullName || a.name });
      });
      return [...map.values()];
    }

    // Фильмы автора: ключи вида film:authorId:N с непустой ссылкой
    function filmsOf(stored, authorId) {
      const p = `${FILM_PREFIX}:${authorId}:`;
      return Object.keys(stored)
        .filter((key) => key.startsWith(p))
        .map((key) => ({
          key,
          n: parseInt(key.slice(p.length), 10),
          url: (stored[key] && stored[key].url) || "",
          title: (stored[key] && stored[key].title) || "",
        }))
        .filter((x) => Number.isFinite(x.n) && x.url)
        .sort((a, b) => a.n - b.n);
    }

    let groups = []; // [{ id, name, films: [...] }] только авторы с фильмами

    function renderFilms(authorFilter) {
      const root = document.getElementById("filmsRoot");
      root.innerHTML = "";

      const visible = authorFilter ? groups.filter((g) => g.id === authorFilter) : groups;

      visible.forEach((group) => {
        const section = document.createElement("section");
        section.className = "films-group";
        const heading = document.createElement("h2");
        heading.textContent = group.name;
        section.append(heading);

        const grid = document.createElement("div");
        grid.className = "films-grid";

        group.films.forEach((film) => {
          const tile = document.createElement("article");
          tile.className = "film-tile";
          tile.id = film.key.replace(/:/g, "--");

          const title = document.createElement("h3");
          title.textContent = film.title || `Фильм ${film.n}`;
          tile.append(title);

          const media = parseVideoUrl(film.url);
          if (media && media.type === "iframe") {
            const frame = document.createElement("div");
            frame.className = "film-frame";
            const iframe = document.createElement("iframe");
            iframe.src = media.src;
            iframe.title = title.textContent;
            iframe.loading = "lazy";
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
            iframe.allowFullscreen = true;
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            frame.append(iframe);
            tile.append(frame);
          } else if (media && media.type === "video") {
            const frame = document.createElement("div");
            frame.className = "film-frame";
            const video = document.createElement("video");
            video.src = media.src;
            video.controls = true;
            video.preload = "metadata";
            frame.append(video);
            tile.append(frame);
          } else {
            const link = document.createElement("a");
            link.className = "text-button";
            link.href = film.url;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = "Открыть фильм по ссылке";
            tile.append(link);
          }

          grid.append(tile);
        });

        section.append(grid);
        root.append(section);
      });
    }

    async function init() {
      const root = document.getElementById("filmsRoot");

      let stored = {};
      try {
        const response = await fetch("/api/videos");
        const data = await response.json();
        stored = data.videos || {};
      } catch {
        // сервер недоступен — покажем пустую страницу
      }

      groups = collectAuthors()
        .map((a) => ({ ...a, films: filmsOf(stored, a.id) }))
        .filter((g) => g.films.length);

      if (!groups.length) {
        root.innerHTML = `<p class="films-empty">Фильмы скоро появятся.</p>`;
        return;
      }

      const select = document.getElementById("authorFilter");
      select.innerHTML = "";
      const all = document.createElement("option");
      all.value = "";
      all.textContent = "Все авторы";
      select.append(all);
      groups.forEach((g) => {
        const opt = document.createElement("option");
        opt.value = g.id;
        opt.textContent = g.name;
        select.append(opt);
      });
      document.getElementById("filmsToolbar").hidden = groups.length < 2;
      select.addEventListener("change", () => renderFilms(select.value));

      renderFilms("");

      if (location.hash) {
        const target = document.getElementById(location.hash.slice(1));
        if (target) {
          target.classList.add("is-target");
          target.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
    }

    init();
  </script>
</body>
</html>
